name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  check_suite:
    types: [completed]
  workflow_run:
    workflows: [Validate Android Build]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'check_suite' && github.event.check_suite.conclusion == 'success') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.base.ref == 'main') }}

    steps:
      - name: Merge Dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          endpoint="repos/$GITHUB_REPOSITORY/pulls"
          numbers="$PR_NUMBER"
          if [[ -z "$numbers" ]]; then
            numbers=$(gh api --paginate "$endpoint?state=open&base=main&per_page=100" \
              --jq '.[] | select(.user.login == "dependabot[bot]" and .draft == false) | .number')
          fi

          failed=0
          for number in $numbers; do
            sha=$(gh api "$endpoint/$number" --jq \
              'select(.state == "open" and .base.ref == "main" and .user.login == "dependabot[bot]" and .draft == false) | .head.sha')
            [[ -n "$sha" ]] || continue
            # Events only trigger a retry; never treat their SHA/conclusion as approval.
            # Require a GitHub Actions check from our validation workflow for THIS head.
            checks=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?per_page=100")
            run_ids=$(jq -r --arg sha "$sha" '
              .[].check_runs[]
              | select(.name == "Test and build release APK" and .head_sha == $sha
                and .status == "completed" and .conclusion == "success"
                and .app.slug == "github-actions")
              | .details_url
              | capture("/actions/runs/(?<id>[0-9]+)/job/[0-9]+$").id' <<< "$checks")
            validated=false
            for run_id in $run_ids; do
              run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")
              if jq -e --arg sha "$sha" --arg repo "$GITHUB_REPOSITORY" '
                .head_sha == $sha and .status == "completed" and .conclusion == "success"
                and .path == ".github/workflows/release-build.yml"
                and .repository.full_name == $repo
                and (.event == "pull_request" or .event == "push")' <<< "$run" >/dev/null; then
                validated=true
              fi
            done
            if [[ "$validated" != 'true' ]]; then
              echo "Skipping Dependabot PR #$number: validation missing for $sha"
              continue
            fi
            echo "Merging Dependabot PR #$number at $sha"
            if ! gh api --method PUT "$endpoint/$number/merge" \
              -f merge_method=squash -f sha="$sha" --jq 'if .merged then .message else error(.message) end'; then
              echo "::error::Failed to merge Dependabot PR #$number"
              failed=1
            fi
          done
          exit "$failed"
